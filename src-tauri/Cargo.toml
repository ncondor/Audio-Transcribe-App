[package]
name = "audio-transcribe-app"
version = "0.1.0"
description = "Local Whisper transcription with GPU acceleration"
authors = ["you"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "audio_transcribe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Whisper bindings (whisper.cpp). CUDA is enabled at build time.
whisper-rs = { version = "0.13", default-features = false }

# Model downloads + HTTP
reqwest = { version = "0.12", features = ["stream", "rustls-tls"] }
futures-util = "0.3"

# Audio decoding fallback (FFmpeg is the primary path)
hound = "3.5"

[features]
# Toggle GPU features. Activate `cuda` for Nvidia builds.
default = ["cuda"]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]
cpu = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
